<style>

*{box-sizing:border-box}:root[data-theme=dark]{--bg:#14171F;--card:#1D222D;--ink:#F1EDE4;--mut:#9CA3AF;--line:#2C3342;--acc:#F97316;--acc2:#3A2418}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--ink);font:15px/1.45 Mukta,system-ui,sans-serif;overflow-x:hidden}

.mut{color:var(--mut);font-size:13px}.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}

.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}.sc{overflow-x:auto;display:flex;gap:6px;padding-bottom:4px}
.b{display:inline-block;font-size:11px;padding:2px 8px;border-radius:6px;background:var(--acc2);color:var(--acc);font-weight:600;margin:0 4px 4px 0}
.b.ok{background:#DCFCE7;color:var(--ok)}.b.w{background:#FEF3C7;color:var(--warn)}.b.x{background:#FEE2E2;color:var(--bad)}
button,input,select,textarea{font:inherit;color:var(--ink)}
.btn{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:11px 14px;font-weight:700;min-height:44px;cursor:pointer}
.btn.g{background:var(--card);color:var(--ink);border:1px solid var(--line)}.btn.s{padding:6px 10px;min-height:36px;font-size:13px}.btn.f{width:100%}
input,select,textarea{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px;min-height:44px}

nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;width:100%;max-width:640px}nav button{flex:1;background:none;border:0;padding:8px 2px;font-size:11px;color:var(--mut);min-height:52px}nav button.on{color:var(--acc);font-weight:700}nav i{display:block;font-style:normal;font-size:20px}
#sh{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:none;align-items:flex-end;justify-content:center}
#sh.o{display:flex}#sb{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:14px 14px calc(24px + env(safe-area-inset-bottom,0px))}
.bar{height:6px;background:var(--line);border-radius:4px;flex:1}.bar u{display:block;height:6px;background:var(--acc);border-radius:4px}
.cmpb{position:fixed;left:12px;right:12px;bottom:calc(66px + env(safe-area-inset-bottom,0px));max-width:616px;margin:0 auto;z-index:20}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.gal{display:flex;gap:6px;overflow-x:auto}.gal img{height:170px;border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;border-top:1px solid var(--line);text-align:center}td:first-child{text-align:left;color:var(--mut)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}.tt{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;z-index:99}
</style></head><body><div id="app"><main id="m"></main><nav><div id="nv"></div></nav></div><div id="sh"><div id="sb"></div></div>
<script>
(function(){'use strict';
function uid(){return window.crypto&&crypto.randomUUID?crypto.randomUUID():'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
var KEY='roomrahi2',$=function(i){return document.getElementById(i)};
var D={role:'tenant',lang:'hi',rooms:[],favs:[],cmp:[],work:null,shift:'',visits:[],books:[],reports:[],saved:[],draft:null,fcol:{},colSel:'',hist:[],sq:[],notes:{},chk:{},onb:0,theme:'',lastRent:{},guest:null};
var S;try{S=Object.assign({},D,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){S=Object.assign({},D)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('स्टोरेज भर गया — पुराने फोटो हटाएँ')}if(window.RR&&RR.hooks)RR.hooks.forEach(function(f){try{f()}catch(e){}})}
var MAPV=false,tab='home',F={text:'',pt:'all',max:null,ac:0,food:0,furn:0,ver:0,sui:'',km:null},me=null,now=Date.now();
var T={hi:{home:'होम',search:'खोजें',saved:'सेव',reqs:'रिक्वेस्ट',me:'प्रोफाइल',msgs:'संदेश',dash:'डैशबोर्ड',props:'प्रॉपर्टी',hello:'नमस्ते 👋',ask:'कैसा कमरा चाहिए?',near:'📍 पास में',empty:'अभी कोई कमरा नहीं मिला।',real:'असली मासिक खर्च (अनुमान)'},
en:{home:'Home',search:'Search',saved:'Saved',reqs:'Requests',me:'Profile',msgs:'Messages',dash:'Dashboard',props:'Properties',hello:'Hello 👋',ask:'What kind of room do you need?',near:'📍 Near me',empty:'No rooms found yet.',real:'Real monthly cost (estimate)'}};
function t(k){return T[S.lang][k]||k}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function inr(n){return'₹'+Math.round(n||0).toLocaleString('en-IN')}
function toast(m){var d=document.createElement('div');d.className='tt';d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove()},2800)}
var TYPES={room:['🛏','सिंगल रूम'],pg:['🏢','PG/हॉस्टल'],rk:['🏡','1RK'],house:['🏠','मकान/फ्लोर'],shared:['👥','शेयर्ड रूम']};
var AM=['AC','कूलर','पंखा','WiFi','अटैच बाथ','किचन','पार्किंग','लॉन्ड्री','पावर बैकअप','पानी 24x7','बालकनी','सिक्योरिटी','फर्निश्ड','खाना'];
var SUI=['लड़के','लड़कियाँ','फैमिली'];
/* ---------- geo / intelligence ---------- */
function hav(a,b,c,d){var R=6371,p=Math.PI/180,x=Math.sin((c-a)*p/2),y=Math.sin((d-b)*p/2);var h=x*x+Math.cos(a*p)*Math.cos(c*p)*y*y;return 2*R*Math.asin(Math.sqrt(h))}
function dist(r,p){return(p&&r.lat!=null&&r.lng!=null)?hav(p.lat,p.lng,r.lat,r.lng):null}
function here(){return me||S.work}
function fresh(r){if(r.state==='rented'||r.state==='paused')return r.state;var a=(now-(r.confirmed||r.created))/864e5;return a<15?'active':a<30?'confirm':'expired'}
var FL={active:['सक्रिय','ok'],confirm:['पुष्टि बाकी','w'],expired:['पुराना','x'],rented:['किराए पर गया','x'],paused:['रुका हुआ','w']};
function areaRents(r){var k=(r.area||'').trim().toLowerCase();return S.rooms.filter(function(x){return x.id!==r.id&&x.rent>0&&(x.area||'').trim().toLowerCase()===k&&!x.demo===!r.demo}).map(function(x){return x.rent})}
function intel(r){var l=areaRents(r);if(l.length<3)return null;var a=l.reduce(function(s,v){return s+v},0)/l.length;return{avg:a,pct:Math.round((r.rent-a)/a*100),n:l.length}}
function cost(r){var e=r.elecInc?0:600,f=r.foodInc?0:1500,d=dist(r,S.work),tr=d==null?null:Math.round(d*2*26*3);return{rent:r.rent,e:e,f:f,tr:tr,tot:r.rent+e+f+(tr||0)}}
function flags(r){var f=[],ph=r.phone&&S.rooms.filter(function(x){return x.id!==r.id&&x.phone===r.phone}).length;if(ph>=2)f.push('एक फोन नंबर पर '+(ph+1)+' लिस्टिंग');var i=intel(r);if(i&&i.pct<-45)f.push('किराया इलाके से बहुत कम');if(i&&i.pct>100)f.push('किराया इलाके से बहुत ज़्यादा');if(S.rooms.some(function(x){return x.id!==r.id&&x.desc&&r.desc&&x.desc===r.desc}))f.push('एक जैसा विवरण');return f}
function trust(r){var s=0,w=[];if(r.phone){s+=25;w.push('फोन दिया')}if(r.lat!=null){s+=20;w.push('GPS लोकेशन')}if((r.imgs||[]).length>=3){s+=25;w.push('3+ फोटो')}if(r.desc&&r.desc.length>30){s+=10;w.push('विवरण')}if(fresh(r)==='active'){s+=20;w.push('हाल में पुष्टि')}if(r.verified){s+=15;w.push('एडमिन वेरिफाइड')}return{s:Math.max(0,Math.min(100,s-flags(r).length*15)),w:w}}
function score(r){var i=intel(r),d=dist(r,here()),c=r.rent<=0?0:1;var p=i?Math.max(0,Math.min(10,7-i.pct/10)):6,l=d==null?6:Math.max(0,Math.min(10,10-d*1.5)),f=Math.min(10,3+(r.am||[]).length*1.1),ph=Math.min(10,(r.imgs||[]).length*2.5),tr=Math.max(0,trust(r).s/10);return{t:Math.round((p*25+l*25+f*15+ph*10+tr*25)/10*c),p:p,l:l,f:f,ph:ph,tr:tr}}
/* ---------- search ---------- */
var NUM={'एक':1,'दो':2,'तीन':3,'चार':4,'पांच':5,'पाँच':5,'छह':6,'सात':7,'आठ':8,'नौ':9,'दस':10,ek:1,do:2,teen:3,char:4,paanch:5,panch:5,saat:7,aath:8,das:10};
function parse(q){var s=String(q).toLowerCase().replace(/,/g,''),f={text:'',pt:'all',max:null,ac:0,food:0,furn:0,ver:0,sui:'',km:null},m;
m=s.match(/(\d+(?:\.\d+)?)\s*(k|हज़ार|हजार|hazaar|hazar)/);if(m)f.max=parseFloat(m[1])*1000;else{m=s.match(/(\d{4,6})/);if(m)f.max=+m[1];else{m=s.match(/(\S+)\s*(हज़ार|हजार|hazaar|hazar)/);if(m&&NUM[m[1]])f.max=NUM[m[1]]*1000}}
m=s.match(/(\d+(?:\.\d+)?)\s*(km|किमी)/);if(m)f.km=+m[1];
if(/\bpg\b|hostel|हॉस्टल|पीजी/.test(s))f.pt='pg';else if(/1\s*rk|\brk\b/.test(s))f.pt='rk';else if(/bhk|house|floor|मकान|फ्लोर/.test(s))f.pt='house';else if(/shared|शेयर/.test(s))f.pt='shared';else if(/room|कमरा|रूम/.test(s))f.pt='room';
if(/furnish|फर्निश/.test(s))f.furn=1;if(/\bac\b|एसी/.test(s))f.ac=1;if(/food|khana|खाना|mess/.test(s))f.food=1;if(/verified|वेरिफाइड/.test(s))f.ver=1;
if(/ladki|girls?|लड़की|लड़कियाँ/.test(s))f.sui='लड़कियाँ';else if(/ladke|boys?|लड़के/.test(s))f.sui='लड़के';else if(/family|फैमिली/.test(s))f.sui='फैमिली';
var a=s.match(/(?:sector|सेक्टर)\s*(\d+)/);f.text=a?'सेक्टर '+a[1]:'';
if(!f.text){var w=s.replace(/\d+|₹|के अंदर|ke andar|tak|तक|room|कमरा|रूम|pg|hostel|furnished|ac|food|खाना|boys|girls|family|verified|factory|फैक्ट्री|ke paas|के पास|with|में|me|mein|chahiye|चाहिए|km|हज़ार|हजार|hazaar|paanch|panch/g,' ').trim().split(/\s+/).filter(function(x){return x.length>2});if(w.length&&!/^(ek|do)$/.test(w[0]))f.text=w.join(' ')}
return f}
function list(){var q=F.text.toLowerCase(),p=here(),out=S.rooms.filter(function(r){if(S.role==='owner'&&r.mine===false)return 0;var st=fresh(r);if(st==='rented'||st==='paused')return S.role==='owner';
if(F.pt!=='all'&&r.type!==F.pt)return 0;if(F.max&&r.rent>F.max)return 0;if(F.ac&&(r.am||[]).indexOf('AC')<0)return 0;if(F.food&&!r.foodInc&&(r.am||[]).indexOf('खाना')<0)return 0;if(F.furn&&(r.am||[]).indexOf('फर्निश्ड')<0)return 0;
if(F.ver&&trust(r).s<70)return 0;if(F.sui&&r.sui&&r.sui.indexOf(F.sui)<0)return 0;if(F.km){var d=dist(r,p);if(d!=null&&d>F.km)return 0}
if(q&&(r.name+' '+r.area+' '+r.city).toLowerCase().indexOf(q)<0)return 0;return 1});
out.sort(function(a,b){var k=function(r){var s=score(r).t,st=fresh(r);return s-(st==='confirm'?15:st==='expired'?40:0)};return k(b)-k(a)});return out}
/* ---------- views ---------- */
function card(r){var d=dist(r,here()),st=fresh(r),fl=FL[st],ty=TYPES[r.type]||TYPES.room,ph=(r.imgs||[])[0];
return'<div class="card" data-act="open" data-id="'+r.id+'" role="button" tabindex="0"><div class="ph" style="'+(ph?'background-image:url('+ph+')':'')+'">'+(ph?'':ty[0])+'</div><div class="pad"><div class="row sp"><b style="font-size:18px">'+inr(r.rent)+'<span class="mut">/माह</span></b><span class="row"><button class="chip" aria-label="तुलना" data-act="cmp" data-id="'+r.id+'">'+(S.cmp.indexOf(r.id)>-1?'✅':'⚖')+'</button><button class="chip" aria-label="सेव" data-act="fav" data-id="'+r.id+'">'+(S.favs.indexOf(r.id)>-1?'❤️':'🤍')+'</button></span></div>'+
'<div>'+esc(r.name)+'</div><div class="mut">'+ty[1]+' • '+esc(r.area)+(d!=null?' • '+d.toFixed(1)+' km':'')+'</div><div style="margin-top:6px"><span class="b '+fl[1]+'">'+fl[0]+'</span><span class="b">स्कोर '+score(r).t+'</span>'+(r.verified?'<span class="b ok">✓ वेरिफाइड</span>':'')+(trust(r).s>=70?'<span class="b ok">भरोसेमंद</span>':'')+(r.demo?'<span class="b w">डेमो</span>':'')+(flags(r).length?'<span class="b x">जाँच ज़रूरी</span>':'')+'</div></div></div>'}
function chips(){return'<div class="sc">'+Object.keys(TYPES).map(function(k){return'<button class="chip'+(F.pt===k?' on':'')+'" data-act="pt" data-v="'+k+'">'+TYPES[k][0]+' '+TYPES[k][1]+'</button>'}).join('')+'</div>'+'<div class="sc" style="margin-top:6px">'+[['ac','❄ AC'],['food','🍳 खाना'],['furn','🪑 फर्निश्ड'],['ver','🛡 वेरिफाइड']].map(function(x){return'<button class="chip'+(F[x[0]]?' on':'')+'" data-act="tg" data-v="'+x[0]+'">'+x[1]+'</button>'}).join('')+SUI.map(function(x){return'<button class="chip'+(F.sui===x?' on':'')+'" data-act="sui" data-v="'+x+'">'+x+'</button>'}).join('')+'</div>'}
function empty(){return'<div class="card pad" style="text-align:center"><div style="font-size:36px">🏠</div><p>'+t('empty')+'</p><button class="btn" data-act="add">+ कमरा जोड़ें (ओनर)</button> '+(window.RR&&RR.cloud?'':'<button class="btn g" data-act="demo">डेमो लिस्टिंग लोड करें</button><p class="mut">डेमो लिस्टिंग सिर्फ टेस्ट के लिए हैं और "डेमो" टैग के साथ दिखती हैं।</p>')+'</div>'}
function searchBox(){return'<div class="row"><input id="q" placeholder="जैसे: मानेसर 5000 के अंदर फर्निश्ड रूम" value="'+esc(F.text)+'" aria-label="खोज"><button class="btn s" data-act="go">खोजें</button><button class="btn g s" data-act="mic" aria-label="बोलकर खोजें">🎤</button></div>'}
function render(){var m=$('m'),h='',own=S.role==='owner';
if(tab==='home'||tab==='dash'){var l=list();
if(own){var mine=S.rooms.filter(function(r){return r.mine!==false}),v=S.visits.filter(function(x){return x.st==='REQUESTED'}).length+S.books.filter(function(x){return x.st==='REQUESTED'}).length;
h='<h1>'+t('dash')+'</h1><div class="g2"><div class="card pad"><b>'+mine.filter(function(r){return fresh(r)==='active'}).length+'</b><div class="mut">सक्रिय</div></div><div class="card pad"><b>'+mine.filter(function(r){return fresh(r)==='confirm'||fresh(r)==='expired'}).length+'</b><div class="mut">पुष्टि चाहिए</div></div><div class="card pad"><b>'+v+'</b><div class="mut">नई रिक्वेस्ट</div></div><div class="card pad"><b>'+S.favs.length+'</b><div class="mut">सेव (इस डिवाइस पर)</div></div></div><button class="btn f" data-act="add">+ नई प्रॉपर्टी जोड़ें</button>'+(window.RR?RR.slot('dash'):'')+'<h2>मेरी प्रॉपर्टी</h2>'+(mine.length?mine.map(card).join(''):empty())}
